<!DOCTYPE html>
<html>

<head>

<title>Button Phone SMS Attendance</title>

<style>

body{

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',Arial;
    background:linear-gradient(135deg,#11998e,#38ef7d);

}


.sms-card{

    width:450px;
    background:white;
    padding:35px;
    border-radius:25px;
    box-shadow:0 15px 35px rgba(0,0,0,0.25);
    text-align:center;

}


h2{

    color:#11998e;
    font-size:28px;

}


label{

    font-weight:bold;
    color:#444;

}


input{

    width:90%;
    padding:12px;
    margin-top:8px;
    border:none;
    outline:none;
    background:#f2f2f2;
    border-radius:12px;
    font-size:15px;

}


button{

    width:95%;
    padding:13px;
    margin-top:15px;
    background:#11998e;
    color:white;
    border:none;
    border-radius:20px;
    font-size:17px;
    cursor:pointer;

}


button:hover{

    background:#0b7d73;
    transform:scale(1.03);

}


.sms-format{

    margin-top:25px;
    background:#e8f5e9;
    padding:20px;
    border-radius:20px;
    text-align:center;

}


.example{

    background:white;
    padding:12px;
    margin:10px;
    border-radius:15px;
    font-size:16px;

}


.info{

    color:#555;
    font-size:15px;

}


</style>


</head>


<body>


{% if message %}

<script>

alert("{{ message }}");

</script>

{% endif %}



<div class="sms-card">


<h2>
📞 Button Phone SMS Attendance
</h2>



<form method="POST" action="/sms_attendance">



<label>
Parent Mobile Number
</label>

<br>

<input type="text" 
name="phone"
placeholder="Enter Mobile Number"
required>


<br><br>



<label>
SMS Message
</label>

<br>


<input type="text"
name="message"
placeholder="Example: S001 BREAKFAST YES"
required>



<br><br>



<button type="submit">

📩 Receive SMS

</button>



</form>





<div class="sms-format">


<h3>
📱 SMS Format
</h3>



<p>
<b>Send SMS like:</b>
</p>



<div class="example">

✅ S001 BREAKFAST YES

</div>



<div class="example">

✅ S001 LUNCH YES

</div>




<p class="info">

👨‍🎓 Student ID + 🍱 Meal + Confirmation

</p>



<hr>



<p>

✅ YES - Attendance Confirm

</p>


<p>

❌ NO - Not Attending

</p>



</div>



</div>


</body>

</html>
