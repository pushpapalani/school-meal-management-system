
<!DOCTYPE html>
<html>

<head>

<title>School Meal Management System - Sign In</title>

<style>

body{
background:linear-gradient(135deg,#4facfe,#00f2fe);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
}

.box{
background:white;
width:380px;
padding:30px;
border-radius:15px;
text-align:center;
box-shadow:0px 10px 20px gray;
}

input{
width:90%;
padding:12px;
margin:10px;
border-radius:8px;
border:1px solid #ccc;
}

button{
width:95%;
padding:12px;
background:#007bff;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

a{
text-decoration:none;
color:#007bff;
}

.error{
color:red;
font-size:14px;
margin-bottom:10px;
}

</style>

</head>

<body>

<div class="box">

<div style="text-align:right;">
<a href="/signup">Sign Up</a>
</div>

<h2>🍱 School Meal Management System</h2>

<h3>Sign In</h3>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="POST">

<input
type="email"
name="email"
placeholder="Enter Email"
required>

<input
type="password"
name="password"
placeholder="Enter Password"
required>

<div style="text-align:right;padding-right:15px;">
<a href="/forgot_password">Forgot Password?</a>
</div>

<br>

<button type="submit">
Sign In
</button>

</form>

<br>

<p>
New User?
<a href="/signup">Sign Up</a>
</p>

</div>

</body>
</html>
