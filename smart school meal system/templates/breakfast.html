<!DOCTYPE html>

<html>

<head>

<title>Breakfast Attendance</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

body{

    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',Arial;
    background:linear-gradient(135deg,#ff9966,#ffcc33);

}

.breakfast-card{

    width:380px;
    background:white;
    padding:35px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,0.25);

}

.food-icon{

    font-size:65px;

}

h2{

    color:#e67e22;
    font-size:28px;

}

p{

    color:#666;

}

.student-info{

    background:#f3f3f3;
    padding:15px;
    border-radius:15px;
    margin:20px 0;
    text-align:left;

}

.student-info strong{

    color:#e67e22;

}

.student-id{

    font-size:18px;
    font-weight:bold;
    color:#34495e;
    margin-top:5px;

}

button{

    width:100%;
    padding:13px;
    border:none;
    border-radius:20px;
    background:#e67e22;
    color:white;
    font-size:17px;
    cursor:pointer;

}

button:hover{

    background:#ca6f1e;
    transform:scale(1.03);

}

.back{

    display:inline-block;
    margin-top:15px;
    background:#34495e;
    color:white;
    padding:12px 30px;
    border-radius:20px;
    text-decoration:none;

}

.footer{

    margin-top:20px;
    font-size:13px;
    color:#888;

}

</style>

</head>

<body>

<div class="breakfast-card">

<div class="food-icon">
    🍳
</div>

<h2>
    Breakfast Attendance
</h2>

<p>
    Mark your breakfast attendance
</p>

<!-- Logged-in Student Details -->

<div class="student-info">

    <strong>👨‍🎓 Logged-in Student</strong>

    <div class="student-id">
        🆔 Student ID: {{ student_id }}
    </div>

</div>

<form method="POST" onsubmit="return checkInternet()">

    <button type="submit">

        ✅ Mark Breakfast

    </button>

</form>

<a href="/student_dashboard" class="back">

    ⬅ Back

</a>

<div class="footer">

    🍱 Smart Digital Meal Attendance System

</div>


</div>

<script>

function checkInternet() {

    if (!navigator.onLine) {

        alert("❌ Attendance not submitted. Please check your internet connection.");

        return false;

    }

    return true;

}

</script>

</body>

</html>
