
<!DOCTYPE html>
<html>

<head>

    <title>Admin Sign Up - School Meal Management System</title>

    <style>

        body {

            background: linear-gradient(135deg,#667eea,#764ba2);

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial;

            margin: 0;

        }


        .box {

            background: white;

            width: 400px;

            padding: 30px;

            border-radius: 15px;

            text-align: center;

            box-shadow: 0px 10px 20px gray;

        }


        h2 {

            color: #333;

        }


        h3 {

            color: #555;

        }


        input {

            width: 90%;

            padding: 12px;

            margin: 10px;

            border-radius: 8px;

            border: 1px solid #ccc;

            box-sizing: border-box;

        }


        button {

            width: 95%;

            padding: 12px;

            background: #667eea;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;

        }


        button:hover {

            background: #4b5dc7;

        }


        a {

            text-decoration: none;

            color: #667eea;

            font-weight: bold;

        }


        .password-box {

            position: relative;

            width: 100%;

        }


        .password-box input {

            width: 90%;

        }


        .password-box span {

            position: absolute;

            right: 35px;

            top: 22px;

            cursor: pointer;

        }


        .message {

            color: red;

            margin-bottom: 10px;

            font-weight: bold;

        }

    </style>

</head>


<body>


<div class="box">


    <h2>🍱 School Meal Management System</h2>


    <h3>👨‍💼 Admin Sign Up</h3>


    {% if message %}

        <p class="message">

            {{ message }}

        </p>

    {% endif %}


    <form method="POST">


        <!-- Full Name -->

        <input
            type="text"
            name="fullname"
            placeholder="Full Name"
            required>


        <!-- Phone -->

        <input
            type="text"
            name="phone"
            placeholder="Phone Number"
            required>


        <!-- Email -->

        <input
            type="email"
            name="email"
            placeholder="Email Address"
            required>


        <!-- Admin Secret Code -->

        <div class="password-box">

            <input
                type="password"
                id="admin_code"
                name="admin_code"
                placeholder="Admin Secret Code"
                required>

            <span onclick="showPassword('admin_code')">

                👁

            </span>

        </div>


        <!-- Password -->

        <div class="password-box">

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                required>

            <span onclick="showPassword('password')">

                👁

            </span>

        </div>


        <!-- Confirm Password -->

        <div class="password-box">

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm Password"
                required>

            <span onclick="showPassword('confirm_password')">

                👁

            </span>

        </div>


        <button type="submit">

            Create Admin Account

        </button>


    </form>


    <br>


    Already have an account?

    <a href="{{ url_for('admin_login') }}">

        Admin Login

    </a>


</div>


<script>

function showPassword(id) {

    let x = document.getElementById(id);

    if (x.type == "password") {

        x.type = "text";

    }
    else {

        x.type = "password";

    }

}

</script>


</body>

</html>
