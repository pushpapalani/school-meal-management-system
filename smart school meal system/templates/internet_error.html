<!DOCTYPE html>
<html>

<head>
    <title>No Internet</title>

    <style>

    body{
        font-family:Arial;
        background:linear-gradient(135deg,#ff9966,#ff5e62);
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        margin:0;
    }

    .box{
        background:white;
        padding:40px;
        border-radius:20px;
        text-align:center;
        width:420px;
        box-shadow:0 10px 25px rgba(0,0,0,.2);
    }

    h1{
        color:red;
    }

    p{
        font-size:18px;
        color:#555;
    }

    button{
        padding:12px 25px;
        border:none;
        border-radius:10px;
        background:#ff5e62;
        color:white;
        cursor:pointer;
        font-size:16px;
    }

    button:hover{
        background:#e53935;
    }

    </style>

</head>

<body>

<div class="box">

<h1>📶 No Internet Connection</h1>

<p>
Unable to connect to the server.
</p>

<p>
Please check your internet connection and try again.
</p>

<a href="/dashboard">
<button>🏠 Back to Dashboard</button>
</a>

</div>

</body>
</html>
