
<!DOCTYPE html>
<html>

<head>

<title>Forgot Password</title>

<style>

body{

    font-family: Arial, sans-serif;

    background:linear-gradient(135deg,#667eea,#764ba2);

    height:100vh;

    margin:0;

    display:flex;

    justify-content:center;

    align-items:center;

}


.box{

    background:white;

    width:380px;

    padding:35px;

    border-radius:20px;

    text-align:center;

    box-shadow:0 10px 25px rgba(0,0,0,0.2);

}


.icon{

    font-size:55px;

}


h2{

    color:#4a148c;

    margin-bottom:10px;

}


p{

    color:#666;

}


input{

    width:90%;

    padding:13px;

    border-radius:10px;

    border:1px solid #ccc;

    font-size:15px;

    margin:15px 0;

}


button{

    width:100%;

    padding:13px;

    border:none;

    border-radius:12px;

    background:linear-gradient(135deg,#43e97b,#38f9d7);

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}


button:hover{

    background:linear-gradient(135deg,#667eea,#764ba2);

    color:white;

    transform:scale(1.05);

}


a{

    display:block;

    margin-top:20px;

    text-decoration:none;

    color:#667eea;

    font-weight:bold;

}

</style>

</head>


<body>


<div class="box">


    <div class="icon">
        🔐
    </div>


    <h2>Forgot Password?</h2>


    <p>
        Enter your registered email<br>
        to reset your password
    </p>


    <form method="POST">


        <input
            type="email"
            name="email"
            placeholder="📧 Enter Email"
            required>


        <button type="submit">
            🔑 Reset Password
        </button>


    </form>


    <!-- Back to Login -->

    {% if request.args.get('from_page') == 'admin' %}

       <a href="{{ url_for('admin_login') }}">

          ⬅ Back to Admin Login

       </a>

    {% else %}

       <a href="{{ url_for('student_login') }}">

          ⬅ Back to Student Login

       </a>

    {% endif %}


</div>


</body>

</html>
