<!DOCTYPE html>
<html>

<head>

    <title>SMS Attendance History</title>

    <style>

        body{
            font-family:Arial, sans-serif;
            background:#f5f5f5;
            padding:30px;
            text-align:center;
        }

        h2{
            color:#11998e;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            margin-top:20px;
        }

        th,td{
            border:1px solid #ccc;
            padding:10px;
            text-align:center;
        }

        th{
            background:#11998e;
            color:white;
        }

        tr:nth-child(even){
            background:#f2f2f2;
        }

        a{
            text-decoration:none;
            font-weight:bold;
        }

        .delete{
            color:red;
        }

        button{
            margin-top:20px;
            padding:12px 20px;
            border:none;
            border-radius:10px;
            background:#11998e;
            color:white;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#0b7d73;
        }

    </style>

</head>

<body>

<h2>📞 SMS Attendance History</h2>

<table>

<tr>
    <th>ID</th>
    <th>Phone</th>
    <th>Student ID</th>
    <th>Message</th>
    <th>Response</th>
    <th>Date</th>
    <th>Action</th>
</tr>

{% for log in logs %}

<tr>
    <td>{{ log[0] }}</td>
    <td>{{ log[1] }}</td>
    <td>{{ log[2] }}</td>
    <td>{{ log[3] }}</td>
    <td>{{ log[4] }}</td>
    <td>{{ log[5] }}</td>

    <td>
        <a class="delete"
           href="/delete_sms/{{ log[0] }}"
           onclick="return confirm('Are you sure you want to delete this SMS history?')">
           🗑 Delete
        </a>
    </td>

</tr>

{% endfor %}

</table>

<br>

<button type="button" class="back" onclick="history.back()">

⬅ Back

</button>

</body>
</html>
