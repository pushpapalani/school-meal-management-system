
<!DOCTYPE html>
<html>

<head>

    <title>Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        /* Sign Up Button - Top Right */

        .signup-top {

            position: absolute;

            top: 25px;
            right: 35px;

        }

        .signup-top a {

            display: inline-block;

            padding: 10px 20px;

            background: linear-gradient(135deg, #667eea, #764ba2);

            color: white;

            text-decoration: none;

            font-weight: bold;

            font-size: 15px;

            border-radius: 25px;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);

            transition: 0.3s;

        }

        .signup-top a:hover {

            transform: translateY(-2px);

            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);

        }

    </style>

</head>


<body>


    <!-- Sign Up Button -->

    <div class="signup-top">

        <a href="{{ url_for('admin_signup') }}">

            📝 Sign Up

        </a>

    </div>


    <!-- Admin Login Box -->

    <div class="login-box">


        <!-- Logo -->

        <div class="icon">

            🍱

        </div>


        <!-- Heading -->

        <h1>

            School Meal<br>

            Management System

        </h1>


        <h2>

            👨‍💼 Admin Login

        </h2>


        <!-- Login Form -->

        <form method="POST">


            <!-- Username -->

            <div class="input-group">

                <span>👤</span>

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required>

            </div>


            <!-- Password -->

            <div class="input-group">

                <span>🔒</span>

                <input
                    type="password"
                    id="admin_password"
                    name="password"
                    placeholder="Password"
                    required>

                <span
                    onclick="toggleAdminPassword()"
                    style="cursor:pointer;">

                    👁️

                </span>

            </div>


            <!-- Login Button -->

            <button type="submit">

                Login

            </button>


        </form>


        <!-- Forgot Password -->

        <div style="text-align:center; margin-top:15px;">

            <a href="{{ url_for('forgot_password', from_page='admin') }}"
               style="text-decoration:none;
                      font-weight:bold;
                      color:#667eea;">

                🔑 Forgot Password?

            </a>

        </div>


        <!-- Register -->

        <div style="text-align:center; margin-top:12px;">

            <span>New Admin?</span>

            <a href="{{ url_for('admin_signup') }}"
               style="text-decoration:none;
                      font-weight:bold;
                      color:#667eea;">

                📝 Register

            </a>

        </div>


    </div>


    <!-- Password Show / Hide -->

    <script>

        function toggleAdminPassword() {

            let password =
                document.getElementById("admin_password");

            if (password.type === "password") {

                password.type = "text";

            } else {

                password.type = "password";

            }

        }

    </script>


</body>

</html>
