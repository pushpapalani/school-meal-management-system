<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Details</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family: "Segoe UI", Arial, sans-serif;

            min-height: 100vh;

            background: linear-gradient(135deg, #667eea, #764ba2);

            padding: 40px 20px;

        }


        /* Main Container */

        .student-container {

            width: 95%;

            max-width: 1400px;

            margin: auto;

            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0,0,0,0.25);

        }


        /* Heading */

        h2 {

            text-align: center;

            color: #4a148c;

            font-size: 30px;

            margin-bottom: 25px;

        }


        /* Search Box */

        .search-box {

            display: flex;

            justify-content: center;

            margin-bottom: 25px;

        }


        #searchInput {

            width: 400px;

            max-width: 90%;

            padding: 13px 18px;

            font-size: 16px;

            border: 2px solid #667eea;

            border-radius: 30px;

            outline: none;

            transition: 0.3s;

        }


        #searchInput:focus {

            border-color: #4a148c;

            box-shadow: 0 0 10px rgba(74,20,140,0.25);

        }


        /* Table Wrapper */

        .table-wrapper {

            width: 100%;

            overflow-x: auto;

            border-radius: 15px;

        }


        /* Table */

        table {

            width: 100%;

            border-collapse: collapse;

            overflow: hidden;

            border-radius: 15px;

            min-width: 950px;

        }


        /* Table Header */

        th {

            background: linear-gradient(135deg, #4a148c, #6a1b9a);

            color: white;

            padding: 15px 12px;

            text-align: center;

            font-size: 15px;

            white-space: nowrap;

        }


        /* Table Data */

        td {

            padding: 13px 12px;

            text-align: center;

            border-bottom: 1px solid #e5e5e5;

            color: #333;

            font-size: 14px;

        }


        /* Alternate Rows */

        tr:nth-child(even) {

            background-color: #f8f6ff;

        }


        /* Hover */

        tbody tr:hover {

            background-color: #eee5ff;

            transform: scale(1.002);

            transition: 0.2s;

        }


        /* Action Buttons */

        .edit-btn {

            display: inline-block;

            text-decoration: none;

            background: #2196f3;

            color: white;

            padding: 7px 12px;

            border-radius: 7px;

            font-size: 13px;

            font-weight: 600;

            margin-right: 5px;

            transition: 0.3s;

        }


        .edit-btn:hover {

            background: #1565c0;

            transform: translateY(-2px);

        }


        .delete-btn {

            display: inline-block;

            text-decoration: none;

            background: #f44336;

            color: white;

            padding: 7px 12px;

            border-radius: 7px;

            font-size: 13px;

            font-weight: 600;

            transition: 0.3s;

        }


        .delete-btn:hover {

            background: #c62828;

            transform: translateY(-2px);

        }


        /* Back Button */

        .back-container {

            text-align: center;

            margin-top: 30px;

        }


        .back {

            border: none;

            background: linear-gradient(135deg, #667eea, #764ba2);

            color: white;

            padding: 12px 25px;

            border-radius: 25px;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;

        }


        .back:hover {

            transform: translateY(-2px);

            box-shadow: 0 6px 15px rgba(0,0,0,0.2);

        }


        /* Mobile */

        @media (max-width: 768px) {

            body {

                padding: 20px 10px;

            }

            .student-container {

                width: 100%;

                padding: 20px 10px;

            }

            h2 {

                font-size: 24px;

            }

            #searchInput {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<div class="student-container">


    <h2>👨‍🎓 Student Details</h2>


    <!-- Search -->

    <div class="search-box">

        <input

            type="text"

            id="searchInput"

            placeholder="🔍 Search Student..."

            onkeyup="searchStudent()"

        >

    </div>


    <!-- Student Table -->

    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>S.No</th>

                    <th>Student ID</th>

                    <th>Name</th>

                    <th>Class</th>

                    <th>Phone</th>

                    <th>Phone Type</th>

                    <th>Gender</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody>

            {% for student in students %}

                <tr>

                    <td>{{ loop.index }}</td>

                    <td>{{ student[1] }}</td>

                    <td>{{ student[2] }}</td>

                    <td>{{ student[3] }}</td>

                    <td>{{ student[4] }}</td>

                    <td>{{ student[5] }}</td>

                    <td>{{ student[6] }}</td>


                    <td>

                        <a

                            href="/edit_student/{{ student[1] }}"

                            class="edit-btn"

                        >

                            ✏️ Edit

                        </a>


                        <a

                            href="/delete_student/{{ student[1] }}"

                            class="delete-btn"

                            onclick="return confirm('Are you sure you want to delete this student?')"

                        >

                            🗑 Delete

                        </a>

                    </td>

                </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>


    <!-- Back -->

    <div class="back-container">

        <button

            type="button"

            class="back"

            onclick="history.back()"

        >

            ⬅ Back

        </button>

    </div>


</div>


<script>

function searchStudent() {

    let input = document.getElementById("searchInput");

    let filter = input.value.toUpperCase();

    let table = document.querySelector("table");

    let tr = table.getElementsByTagName("tr");


    for (let i = 1; i < tr.length; i++) {

        let text = tr[i].innerText;


        if (text.toUpperCase().indexOf(filter) > -1) {

            tr[i].style.display = "";

        }

        else {

            tr[i].style.display = "none";

        }

    }

}

</script>


</body>

</html>
