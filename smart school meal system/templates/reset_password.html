<!DOCTYPE html>
<html>

<head>
<title>Reset Password</title>
</head>

<body>

<h2>🔑 Create New Password</h2>

<form method="POST" action="/reset_password?email={{ email }}">

<input 
type="password"
name="new_password"
placeholder="New Password"
required>

<br><br>

<input 
type="password"
name="confirm_password"
placeholder="Confirm Password"
required>

<br><br>

<button type="submit">
Update Password
</button>

</form>

<br>

<a href="/">
Back to Login
</a>

</body>

</html>
