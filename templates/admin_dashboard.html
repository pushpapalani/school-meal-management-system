<!DOCTYPE html>
<html>

<head>

<title>Admin Dashboard</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
}


.container{

    background:white;
    width:500px;
    padding:35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);

}


h1{

    color:#4a148c;
    margin-bottom:10px;

}


h3{

    color:#555;

}


hr{

    margin:20px 0;

}


.menu{

    display:grid;
    gap:15px;

}


.btn{

    display:block;
    text-decoration:none;

}


button{

    width:100%;
    padding:14px;

    border:none;
    border-radius:12px;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    background:linear-gradient(135deg,#43e97b,#38f9d7);

    color:#222;

    transition:0.3s;

}


button:hover{

    transform:scale(1.05);

    background:linear-gradient(135deg,#667eea,#764ba2);

    color:white;

}


.logout button{

    background:linear-gradient(135deg,#ff758c,#ff7eb3);

    color:white;

}


.logout button:hover{

    background:#e53935;

}


.footer{

    margin-top:20px;
    color:#777;
    font-size:13px;

}


</style>

</head>


<body>


<div class="container">


<h1>👨‍💼 Admin Dashboard</h1>

<h3>Welcome Admin 👋</h3>


<hr>


<div class="menu">


<a class="btn" href="/add_students">
<button>👨‍🎓 Add Student</button>
</a>


<a class="btn" href="/view_students">
<button>📋 View Students</button>
</a>


<a class="btn" href="/dashboard">
<button>📊 Attendance Dashboard</button>
</a>


<a class="btn" href="/menu">
<button>🍱 Weekly Menu</button>
</a>


<a class="btn" href="/report">
<button>📄 Daily Report</button>
</a>

<a class="btn logout" href="/admin_logout" onclick="return confirm('Are you sure you want to logout?')">
<button>🚪 Logout</button>
</a>


</div>


</div>


</body>

</html>
