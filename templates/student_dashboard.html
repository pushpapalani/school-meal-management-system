<!DOCTYPE html>
<html>

<head>

<title>Student Dashboard</title>


<style>

body{

    font-family:'Segoe UI',Arial;
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

}


.dashboard{

    width:450px;
    background:white;
    padding:35px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,0.3);

}


.logo{

    font-size:60px;

}


h2{

    color:#667eea;
    font-size:30px;

}


.welcome{

    background:#f1f3ff;
    padding:15px;
    border-radius:15px;
    margin:20px 0;

}


.student-id{

    color:#555;
    font-size:17px;

}



.menu{

    display:grid;
    gap:15px;

}



button{

    width:100%;
    padding:14px;
    border:none;
    border-radius:20px;
    font-size:17px;
    cursor:pointer;
    color:white;

}


.breakfast{

    background:#f39c12;

}


.lunch{

    background:#27ae60;

}


.feedback{

    background:#3498db;

}


/* Weekly Menu Button */

.menu-btn{

    background:#9b59b6;

}



.logout{

    background:#e74c3c;

}



button:hover{

    transform:scale(1.03);
    opacity:0.9;

}



.footer{

    margin-top:25px;
    color:#777;
    font-size:14px;

}


</style>


</head>



<body>


<div class="dashboard">


<div class="logo">
🎓
</div>



<h2>
Student Dashboard
</h2>



<div class="welcome">

<h3>
Welcome {{ name }} 👋
</h3>


</div>



<h3>
🍱 School Meal Management System
</h3>


<p>
✅ Login Successful
</p>



<div class="menu">


<a href="/breakfast">

<button class="breakfast">
🍳 Breakfast Attendance
</button>

</a>



<a href="/lunch">

<button class="lunch">
🍛 Lunch Attendance
</button>

</a>



<a href="/feedback">

<button class="feedback">
⭐ Give Feedback
</button>

</a>



<a href="/menu">

<button class="menu-btn">
🍱 View Weekly Menu
</button>

</a>



<a href="/student_logout" onclick="return confirm('Are you sure you want to logout?')">

<button class="logout">
🚪 Logout
</button>

</a>


</div>



</div>


</body>


</html>
