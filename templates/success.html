<!DOCTYPE html>
<html>

<head>

<title>Success</title>

<style>

body{

    height:100vh;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',Arial;
    background:linear-gradient(135deg,#43e97b,#38f9d7);

}


.card{

    width:380px;
    background:white;
    padding:35px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,0.25);

}


.icon{

    font-size:70px;

}


h2{

    color:#27ae60;

}


p{

    color:#555;
    font-size:18px;

}


button{

    margin-top:20px;
    padding:12px 30px;
    border:none;
    border-radius:20px;
    background:#667eea;
    color:white;
    font-size:16px;
    cursor:pointer;

}


button:hover{

    transform:scale(1.05);

}

</style>

</head>


<body>


<div class="card">


<div class="icon">
{{ icon }}
</div>


<h2>
{{ title }}
</h2>


<p>
{{ message }}
</p>


<a href="/student_dashboard">

<button>
⬅ Back to Dashboard
</button>

</a>


</div>


</body>

</html>
